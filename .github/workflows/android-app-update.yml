name: Android app update (over the air)

# Publishes the app's JavaScript to the public `android-app` release whenever
# it changes on main. Installed apps fetch it on their next launch through
# /api/updates/manifest and show "An update is ready · Restart". Native changes
# (new modules, permissions, Expo upgrades) need a new APK instead, and a bump
# of expo.runtimeVersion in app.json: see exports/GST-Pro-Android/README.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "exports/GST-Pro-Android/**"
      - "scripts/publish-app-update.mjs"
      - ".github/workflows/android-app-update.yml"

permissions:
  contents: write

concurrency:
  group: android-app-update
  cancel-in-progress: false

env:
  APP_DIR: exports/GST-Pro-Android
  BACKEND_HOST: ${{ vars.ANDROID_BACKEND_HOST || 'billing.myindiatrips.com' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  ota:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --ignore-scripts; then exit 0; fi
            rm -rf node_modules
          done
          exit 1
      - name: Type-check the app
        working-directory: ${{ env.APP_DIR }}
        run: npm run typecheck
      - name: Export the Android bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          printf 'EXPO_PUBLIC_DOMAIN=%s\n' "$BACKEND_HOST" > .env
          CI=1 EXPO_NO_TELEMETRY=1 npx expo export --platform android --output-dir "$RUNNER_TEMP/export" --clear
      - name: Build the update
        run: node scripts/publish-app-update.mjs "$RUNNER_TEMP/export" "$RUNNER_TEMP/ota" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/android-app" "$BACKEND_HOST"
      - name: Publish to the android-app release
        working-directory: ${{ runner.temp }}/ota
        run: |
          set -e
          R="-R $GITHUB_REPOSITORY"
          gh release view android-app $R >/dev/null 2>&1 || gh release create android-app $R --target main --prerelease \
            --title "Android app (latest)" --notes "Published by CI. Installed GST Pro apps update themselves from here."
          # Assets before the manifest, so a phone never reads a manifest whose files are missing.
          gh release upload android-app $R --clobber $(ls | grep -v '^ota-')
          gh release upload android-app $R --clobber ota-*.json
          # Drop bundles and assets no manifest names any more (the APK and latest.json stay).
          keep=$(cat ota-*.json | grep -o '/android-app/[^"]*' | sed 's#.*/##' | sort -u)
          for old in $(gh release view android-app $R --json assets -q '.assets[].name' | grep -E '^(bundle|asset)-'); do
            echo "$keep" | grep -qx "$old" || gh release delete-asset android-app "$old" $R -y
          done
