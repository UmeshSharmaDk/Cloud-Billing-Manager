name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not tags: a tag can be moved to different code
# after the fact, a SHA cannot. The trailing comment names the release the SHA is. To update one,
# resolve the new tag to its commit (for an annotated tag, the `^{}` line of
# `git ls-remote --tags https://github.com/<owner>/<repo> 'refs/tags/<tag>*'`) and change the SHA
# and the comment together.

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace already delays new releases by a day
      # (`minimumReleaseAge` in pnpm-workspace.yaml), which guards against a
      # freshly published malicious version. That does nothing about known
      # CVEs in packages that have been around for months, which is this step.
      #
      # Scoped to `dependencies`, and that is a deliberate line rather than a way
      # to get green. `pnpm audit --prod` only looks at `dependencies`, so what
      # counts as "shipped" has to be declared there: for the API server that is
      # everything it imports, and for the React app (artifacts/gst-platform)
      # everything Vite bundles into the browser build -- react, the Radix
      # components, pdfjs-dist, tesseract.js, mammoth and so on -- while the
      # build tooling (vite, tailwind, the Replit plugins, @types/*) stays in
      # `devDependencies`. A package the app imports must therefore be added
      # under `dependencies`, or this audit silently stops covering it (the app
      # once kept all of them in devDependencies, which made this step vacuous
      # for everything that runs in the user's browser).
      #
      # Auditing the whole tree also reports high and critical advisories, all
      # of them in build-time tooling that ships nothing: `orval`, the OpenAPI
      # code generator in `lib/api-spec`, and the dev-server side of Vite. A
      # high advisory in the production set is a package an attacker can reach
      # at runtime, so it fails the build; the second step below keeps the rest
      # visible without letting it block an unrelated fix.
      - name: Audit production and browser-bundled dependencies
        run: pnpm audit --prod --audit-level=high

      # `pnpm audit` cannot see xlsx: SheetJS publishes fixed releases only from
      # cdn.sheetjs.com (the npm package is stuck on the vulnerable 0.18.5), so
      # it is installed from a tarball URL that carries no advisory data. This
      # is the substitute check -- fail if the resolved version drops below
      # 0.20.2, which fixes CVE-2023-30533 (prototype pollution) and
      # CVE-2024-22363 (ReDoS). When bumping it, check SheetJS's advisories by hand.
      - name: Assert xlsx is a fixed release
        run: |
          node -e '
            const v = require("./artifacts/gst-platform/node_modules/xlsx/package.json").version;
            const [a, b, c] = v.split(".").map(Number);
            if (a === 0 && (b < 20 || (b === 20 && c < 2))) {
              console.error("::error::xlsx " + v + " is below 0.20.2 (CVE-2023-30533, CVE-2024-22363)");
              process.exit(1);
            }
            console.log("xlsx " + v + " ok");
          '

      # The whole tree, including build-time tooling, reported and not gated.
      # Its advisories are real and worth seeing -- they just do not belong on
      # the path that blocks a fix to an unrelated bug. Clearing them means
      # moving orval and refreshing vite's lockfile entries, which is its own
      # change.
      - name: Audit build-time dependencies (reporting only)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # gitleaks-action runs `gitleaks detect` over a commit range and needs those commits (and
          # the parent of the first one) to exist locally, hence the full clone. What it then scans
          # depends on the event: a pull_request run scans the commits in the PR and a push run scans
          # the commits in that push (`--no-merges --first-parent <first>^..<last>`). It walks the
          # whole history only for workflow_dispatch and schedule runs, and this workflow has
          # neither. So a secret already sitting in older history is not re-found by every run;
          # audit that by hand with `gitleaks detect --config .gitleaks.toml`.
          fetch-depth: 0
      # A hardcoded signing secret shipped in this repository once already.
      #
      # `.gitleaks.toml` baselines exactly the values that leak is made of, and
      # nothing else — see the comments there. They are rotations the operator
      # owes, not findings waved away, and a new secret of any shape still fails.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  no-fallback-secrets:
    name: No fallback secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Catches the exact shape of the original finding: a secret read from the
      # environment with a literal default, so a deployment that forgets to set
      # the variable silently uses a value that is public in this repository.
      - name: Reject `process.env.X ?? "literal"` for secret-shaped names
        run: |
          if grep -rInE 'process\.env(\.|\[")(\w*(SECRET|TOKEN|KEY|PASSWORD|CREDENTIAL)\w*)("\])?\s*(\?\?|\|\|)\s*['"'"'"`]' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
               artifacts lib scripts; then
            echo "::error::A secret is being read with a literal fallback. Fail closed instead."
            exit 1
          fi
          echo "No fallback secrets found."

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Unit tests
        run: pnpm --filter @workspace/api-server run test

      # `pnpm run typecheck` does not build the app, and two security properties of the
      # browser bundle only exist in the build output: the Content-Security-Policy <meta> tag
      # (vite.config.ts strips it for `vite dev`, so it is only ever in a build) and the
      # self-hosted OCR assets that let that policy stay at 'self' (without them tesseract.js
      # falls back to jsDelivr, which the policy blocks, and OCR import breaks at runtime).
      - name: Build the frontend
        env:
          PORT: "25512"
          BASE_PATH: /
        run: pnpm --filter @workspace/gst-platform run build

      - name: Assert the frontend build ships its CSP and self-hosted OCR assets
        run: |
          dist=artifacts/gst-platform/dist/public
          failed=0
          if [ ! -f "$dist/index.html" ]; then
            echo "::error::$dist/index.html was not produced by the frontend build"
            exit 1
          fi
          if ! grep -q 'http-equiv="Content-Security-Policy"' "$dist/index.html"; then
            echo "::error::$dist/index.html has no Content-Security-Policy meta tag; the app would ship with no CSP"
            failed=1
          fi
          for asset in \
            ocr/worker.min.js \
            ocr/core/tesseract-core-simd-lstm.wasm.js \
            ocr/core/tesseract-core-lstm.wasm.js \
            ocr/lang/eng.traineddata.gz; do
            if [ ! -s "$dist/$asset" ]; then
              echo "::error::$dist/$asset is missing or empty; OCR import would fall back to a CDN that the CSP blocks"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "CSP meta tag and self-hosted OCR assets are present in the build."

  integration:
    name: Security integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite is the only thing standing between this repository and the
    # findings it just fixed coming back. It needs a real database: the
    # cross-tenant, lockout, audit and invoice-numbering checks all assert on
    # rows, and the concurrency check needs genuine transaction semantics.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Two connections, and the difference between them is the thing under
      # test. The server runs as an unprivileged role so the policies actually
      # apply to it; migrations and test fixtures run as the owner, which they
      # have to, because the application role deliberately cannot alter a table
      # or read across tenants.
      DATABASE_URL: postgres://gst_app:gst_app@127.0.0.1:5432/gst
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gst
      ALLOWED_ORIGINS: http://localhost:25512
      NODE_ENV: production
      PORT: 8099
      # No outbound call to Have I Been Pwned from CI: the suite must not fail
      # because a third party is having a bad day. The lookup's own logic is
      # covered by the unit tests in the typecheck job.
      DISABLE_BREACH_CHECK: "true"
      # The suite deliberately fails dozens of logins from one address, which
      # would otherwise trip the per-IP limiter. The per-account lockout that
      # F-06 asserts still runs at its real threshold of 10.
      AUTH_RATE_LIMIT_MAX: "500"
      # Registration has its own per-address limit that counts every request,
      # not only failures. The suite registers dozens of accounts and fires a
      # 40-request burst from one address, so it needs the same headroom. The
      # per-recipient mail budget is fixed and is what the suite asserts on.
      REGISTER_RATE_LIMIT_MAX: "500"
      # Registration is two steps now: the response cannot say whether an
      # address is taken, so the outcome is emailed. The server writes mail to
      # this file instead of sending it and the suite reads the verification
      # link from there — which is what lets the suite run the server with
      # NODE_ENV=production rather than a development variant of it.
      MAIL_OUTBOX_PATH: /tmp/outbox.jsonl
      MAIL_FROM: GST Platform <no-reply@example.test>

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create the schema
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: pnpm --filter @workspace/db run push --force

      - name: Create the unprivileged application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gst -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS gst_app;
          CREATE ROLE gst_app LOGIN PASSWORD 'gst_app' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO gst_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gst_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gst_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO gst_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO gst_app;
          SQL

      - name: Apply the row-level security policies
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: pnpm --filter @workspace/db run rls:apply

      - name: Build the API server
        run: pnpm --filter @workspace/api-server run build

      # The server is written to refuse to start on insecure configuration (no or short signing
      # secret, no or wildcard CORS origins, production without a mail transport). The suite below
      # always runs it with a valid configuration, so nothing else would notice if one of those
      # checks were removed or weakened. Each case starts the built server with exactly one thing
      # wrong, under `env -i` so that none of this job's (valid) environment leaks in, and requires
      # that it exits non-zero within 10 seconds, names the setting at fault, and never answers on
      # its port. A control run with a valid configuration proves the harness itself can boot it,
      # so a refusal cannot be a crash from something unrelated.
      - name: Assert the server refuses to boot with insecure configuration
        run: |
          secret="$(openssl rand -base64 48)"
          origins="http://localhost:25512"
          failures=0

          answering() {
            curl -s --max-time 2 -o /dev/null "http://127.0.0.1:${PORT}/api/healthz"
          }

          expect_refusal() {
            local label="$1" setting="$2" out status
            shift 2
            out="$(mktemp)"
            status=0
            timeout 10 env -i PATH="$PATH" PORT="$PORT" DATABASE_URL="$DATABASE_URL" "$@" \
              node artifacts/api-server/dist/index.mjs >"$out" 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::[$label] the server exited 0 instead of refusing to boot"
              failures=$((failures + 1))
            elif [ "$status" -eq 124 ]; then
              echo "::error::[$label] the server was still running after 10 seconds; it must refuse to boot"
              failures=$((failures + 1))
            elif ! grep -q -- "$setting" "$out"; then
              echo "::error::[$label] exited $status, but without naming $setting, so it may have failed for another reason"
              sed 's/^/    | /' "$out" | head -20
              failures=$((failures + 1))
            else
              echo "ok [$label]: exited $status, $(grep -m1 -- "$setting" "$out" | cut -c1-100)"
            fi
            if answering; then
              echo "::error::[$label] something is answering on port $PORT"
              failures=$((failures + 1))
            fi
            rm -f "$out"
          }

          # Control: a valid configuration must boot under this same `env -i` harness. `env` execs
          # node, so $! is the server's own PID and the kill below really stops it (wrapping this
          # in a shell function would leave node running and holding the port).
          control_log="$(mktemp)"
          env -i PATH="$PATH" PORT="$PORT" DATABASE_URL="$DATABASE_URL" \
            SESSION_SECRET="$secret" ALLOWED_ORIGINS="$origins" NODE_ENV=production \
            MAIL_OUTBOX_PATH=/tmp/control-outbox.jsonl \
            node artifacts/api-server/dist/index.mjs >"$control_log" 2>&1 &
          control_pid=$!
          booted=0
          for _ in $(seq 1 30); do
            if curl -sf --max-time 2 "http://127.0.0.1:${PORT}/api/healthz" >/dev/null; then booted=1; break; fi
            sleep 1
          done
          kill "$control_pid" 2>/dev/null || true
          wait "$control_pid" 2>/dev/null || true
          if [ "$booted" -ne 1 ]; then
            echo "::error::the control server (valid configuration) did not boot, so the refusals below would prove nothing"
            cat "$control_log"
            exit 1
          fi
          if answering; then
            echo "::error::the control server is still answering on port $PORT after being stopped"
            exit 1
          fi
          echo "ok [control]: a valid configuration boots"

          expect_refusal "no SESSION_SECRET" SESSION_SECRET \
            ALLOWED_ORIGINS="$origins" NODE_ENV=production MAIL_OUTBOX_PATH=/tmp/refusal-outbox.jsonl
          expect_refusal "SESSION_SECRET too short" SESSION_SECRET \
            SESSION_SECRET=too-short ALLOWED_ORIGINS="$origins" NODE_ENV=production MAIL_OUTBOX_PATH=/tmp/refusal-outbox.jsonl
          expect_refusal "no ALLOWED_ORIGINS" ALLOWED_ORIGINS \
            SESSION_SECRET="$secret" NODE_ENV=production MAIL_OUTBOX_PATH=/tmp/refusal-outbox.jsonl
          expect_refusal "ALLOWED_ORIGINS=*" ALLOWED_ORIGINS \
            SESSION_SECRET="$secret" ALLOWED_ORIGINS='*' NODE_ENV=production MAIL_OUTBOX_PATH=/tmp/refusal-outbox.jsonl
          expect_refusal "production without a mail transport" SMTP_URL \
            SESSION_SECRET="$secret" ALLOWED_ORIGINS="$origins" NODE_ENV=production

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures check(s) failed: the server does not reliably refuse insecure configuration"
            exit 1
          fi
          echo "The server refused to boot in every insecure configuration."

      - name: Start the API server
        run: |
          SESSION_SECRET="$(openssl rand -base64 48)" \
            node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8099/api/healthz >/dev/null; do sleep 1; done'

      - name: Run the integration suite
        run: pnpm --filter @workspace/api-server run test:integration

      # The suite above only makes requests the application is entitled to
      # make, so it would pass just as happily with the policies switched off.
      # This asserts on what the database refuses.
      - name: Assert row-level security actually isolates tenants
        run: pnpm --filter @workspace/db run test:rls

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/api.log
