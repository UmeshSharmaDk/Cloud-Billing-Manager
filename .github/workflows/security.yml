name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace already delays new releases by a day
      # (`minimumReleaseAge` in pnpm-workspace.yaml), which guards against a
      # freshly published malicious version. That does nothing about known
      # CVEs in packages that have been around for months, which is this step.
      #
      # Scoped to `dependencies`, and that is a deliberate line rather than a way
      # to get green. `pnpm audit --prod` only looks at `dependencies`, so what
      # counts as "shipped" has to be declared there: for the API server that is
      # everything it imports, and for the React app (artifacts/gst-platform)
      # everything Vite bundles into the browser build -- react, the Radix
      # components, pdfjs-dist, tesseract.js, mammoth and so on -- while the
      # build tooling (vite, tailwind, the Replit plugins, @types/*) stays in
      # `devDependencies`. A package the app imports must therefore be added
      # under `dependencies`, or this audit silently stops covering it (the app
      # once kept all of them in devDependencies, which made this step vacuous
      # for everything that runs in the user's browser).
      #
      # Auditing the whole tree also reports high and critical advisories, all
      # of them in build-time tooling that ships nothing: `orval`, the OpenAPI
      # code generator in `lib/api-spec`, and the dev-server side of Vite. A
      # high advisory in the production set is a package an attacker can reach
      # at runtime, so it fails the build; the second step below keeps the rest
      # visible without letting it block an unrelated fix.
      - name: Audit production and browser-bundled dependencies
        run: pnpm audit --prod --audit-level=high

      # `pnpm audit` cannot see xlsx: SheetJS publishes fixed releases only from
      # cdn.sheetjs.com (the npm package is stuck on the vulnerable 0.18.5), so
      # it is installed from a tarball URL that carries no advisory data. This
      # is the substitute check -- fail if the resolved version drops below
      # 0.20.2, which fixes CVE-2023-30533 (prototype pollution) and
      # CVE-2024-22363 (ReDoS). When bumping it, check SheetJS's advisories by hand.
      - name: Assert xlsx is a fixed release
        run: |
          node -e '
            const v = require("./artifacts/gst-platform/node_modules/xlsx/package.json").version;
            const [a, b, c] = v.split(".").map(Number);
            if (a === 0 && (b < 20 || (b === 20 && c < 2))) {
              console.error("::error::xlsx " + v + " is below 0.20.2 (CVE-2023-30533, CVE-2024-22363)");
              process.exit(1);
            }
            console.log("xlsx " + v + " ok");
          '

      # The whole tree, including build-time tooling, reported and not gated.
      # Its advisories are real and worth seeing -- they just do not belong on
      # the path that blocks a fix to an unrelated bug. Clearing them means
      # moving orval and refreshing vite's lockfile entries, which is its own
      # change.
      - name: Audit build-time dependencies (reporting only)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A hardcoded signing secret shipped in this repository once already.
      #
      # `.gitleaks.toml` baselines exactly the values that leak is made of, and
      # nothing else — see the comments there. They are rotations the operator
      # owes, not findings waved away, and a new secret of any shape still fails.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  no-fallback-secrets:
    name: No fallback secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches the exact shape of the original finding: a secret read from the
      # environment with a literal default, so a deployment that forgets to set
      # the variable silently uses a value that is public in this repository.
      - name: Reject `process.env.X ?? "literal"` for secret-shaped names
        run: |
          if grep -rInE 'process\.env(\.|\[")(\w*(SECRET|TOKEN|KEY|PASSWORD|CREDENTIAL)\w*)("\])?\s*(\?\?|\|\|)\s*['"'"'"`]' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
               artifacts lib scripts; then
            echo "::error::A secret is being read with a literal fallback. Fail closed instead."
            exit 1
          fi
          echo "No fallback secrets found."

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Unit tests
        run: pnpm --filter @workspace/api-server run test

  integration:
    name: Security integration suite
    runs-on: ubuntu-latest

    # The suite is the only thing standing between this repository and the
    # findings it just fixed coming back. It needs a real database: the
    # cross-tenant, lockout, audit and invoice-numbering checks all assert on
    # rows, and the concurrency check needs genuine transaction semantics.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Two connections, and the difference between them is the thing under
      # test. The server runs as an unprivileged role so the policies actually
      # apply to it; migrations and test fixtures run as the owner, which they
      # have to, because the application role deliberately cannot alter a table
      # or read across tenants.
      DATABASE_URL: postgres://gst_app:gst_app@127.0.0.1:5432/gst
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gst
      ALLOWED_ORIGINS: http://localhost:25512
      NODE_ENV: production
      PORT: 8099
      # No outbound call to Have I Been Pwned from CI: the suite must not fail
      # because a third party is having a bad day. The lookup's own logic is
      # covered by the unit tests in the typecheck job.
      DISABLE_BREACH_CHECK: "true"
      # The suite deliberately fails dozens of logins from one address, which
      # would otherwise trip the per-IP limiter. The per-account lockout that
      # F-06 asserts still runs at its real threshold of 10.
      AUTH_RATE_LIMIT_MAX: "500"
      # Registration has its own per-address limit that counts every request,
      # not only failures. The suite registers dozens of accounts and fires a
      # 40-request burst from one address, so it needs the same headroom. The
      # per-recipient mail budget is fixed and is what the suite asserts on.
      REGISTER_RATE_LIMIT_MAX: "500"
      # Registration is two steps now: the response cannot say whether an
      # address is taken, so the outcome is emailed. The server writes mail to
      # this file instead of sending it and the suite reads the verification
      # link from there — which is what lets the suite run the server with
      # NODE_ENV=production rather than a development variant of it.
      MAIL_OUTBOX_PATH: /tmp/outbox.jsonl
      MAIL_FROM: GST Platform <no-reply@example.test>

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create the schema
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: pnpm --filter @workspace/db run push --force

      - name: Create the unprivileged application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gst -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS gst_app;
          CREATE ROLE gst_app LOGIN PASSWORD 'gst_app' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO gst_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gst_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gst_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO gst_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO gst_app;
          SQL

      - name: Apply the row-level security policies
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: pnpm --filter @workspace/db run rls:apply

      - name: Build the API server
        run: pnpm --filter @workspace/api-server run build

      - name: Start the API server
        run: |
          SESSION_SECRET="$(openssl rand -base64 48)" \
            node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8099/api/healthz >/dev/null; do sleep 1; done'

      - name: Run the integration suite
        run: pnpm --filter @workspace/api-server run test:integration

      # The suite above only makes requests the application is entitled to
      # make, so it would pass just as happily with the policies switched off.
      # This asserts on what the database refuses.
      - name: Assert row-level security actually isolates tenants
        run: pnpm --filter @workspace/db run test:rls

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/api.log
