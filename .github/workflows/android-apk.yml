name: Android APK (internal)

# Builds the signed, arm64 internal APK of exports/GST-Pro-Android.
# Same structure as the CRM's pipeline. The signed build runs only when someone
# with write access starts it (or pushes a release/android-* branch). Pull
# requests get an unsigned compile check that never sees the signing secrets.
on:
  workflow_dispatch:
    inputs:
      backend_host:
        description: "Public backend hostname the app talks to (no https://, no /api). Defaults to billing.myindiatrips.com."
        required: false
  push:
    branches:
      - "release/android-*"
      - main
    # On main, only native changes need a new APK; JavaScript changes reach
    # phones over the air (android-app-update.yml).
    paths:
      - "exports/GST-Pro-Android/package.json"
      - "exports/GST-Pro-Android/app.json"
      - "scripts/refresh-android-build.mjs"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "exports/GST-Pro-Android/**"
      - "scripts/refresh-android-build.mjs"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: exports/GST-Pro-Android

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JavaScript dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Type-check the app
        working-directory: ${{ env.APP_DIR }}
        run: npm run typecheck
      - name: Shared parsers match the website's
        run: |
          # The app is a standalone project, so it carries copies; they must not drift.
          for f in bill-text bank-statement whatsapp; do
            cmp "artifacts/gst-platform/src/lib/$f.ts" "$APP_DIR/lib/$f.ts"
          done
          cd "$APP_DIR" && node lib/importFile.test.ts && node lib/plan-dates.test.ts
      - name: Refresh the Android project
        run: node scripts/refresh-android-build.mjs build-check.invalid
      - name: Compile an unsigned release APK (arm64)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          ls -l app/build/outputs/apk/release/

  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Holds the signing secrets. Add required reviewers to this environment in
    # Settings > Environments so no branch push can reach the key unapproved.
    environment: android-release
    timeout-minutes: 60
    env:
      BACKEND_HOST: ${{ inputs.backend_host || vars.ANDROID_BACKEND_HOST || 'billing.myindiatrips.com' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the backend host
        run: test -n "$BACKEND_HOST" || { echo "Set the backend_host input or the ANDROID_BACKEND_HOST repository variable."; exit 1; }

      - name: Install JavaScript dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          # npm occasionally dies with "Exit handler never called!"; retry, and show its own log if it keeps failing.
          for attempt in 1 2 3; do
            # No lifecycle scripts: the signing key lands on this runner later.
            if npm ci --no-audit --no-fund --ignore-scripts; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt). Last lines of npm's debug log:"
            tail -n 60 "$(ls -t ~/.npm/_logs/*.log | head -1)" || true
            rm -rf node_modules
          done
          exit 1

      # Every APK needs a higher versionCode than the last, or Android will not
      # install it as an update. Run numbers only grow.
      - name: Choose the version code
        run: echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Refresh the Android project
        run: node scripts/refresh-android-build.mjs "$BACKEND_HOST"

      - name: Type-check the app
        working-directory: ${{ env.APP_DIR }}
        run: npm run typecheck

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is not set."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gstpro-internal.jks"

      - name: Build the release APK (arm64)
        working-directory: ${{ env.APP_DIR }}/android
        env:
          # Read by signingConfigs.release in android/app/build.gradle.
          # ANDROID_KEY_PASSWORD is optional; it falls back to the store password.
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'gstpro' }}
        run: |
          test -n "$KS_PASS" || { echo "Secret ANDROID_KEYSTORE_PASSWORD is not set."; exit 1; }
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PinternalDistribution=true \
            -PinternalKeystorePath="$RUNNER_TEMP/gstpro-internal.jks" \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify the APK
        id: verify
        run: |
          set -e
          APK=$(ls "$APP_DIR"/android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(node -p "require('./$APP_DIR/app.json').expo.version")
          OUT="GST-Pro-Internal-v${VERSION}-build${ANDROID_VERSION_CODE}-ARM64.apk"
          cp "$APK" "$OUT"
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs -v "$OUT" | grep -E "Verifies|Verified using|certificate DN|SHA-256 digest" | head -6
          echo "--- manifest ---"
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code"
          echo "--- embedded app bundle ---"
          unzip -p "$OUT" assets/index.android.bundle > bundle.bin
          echo "backend host present: $(grep -a -c "$BACKEND_HOST" bundle.bin)"
          if grep -a -q -E 'replit\.(app|dev)' bundle.bin; then echo "FAIL: a Replit address is embedded"; exit 1; fi
          test "$(grep -a -c "$BACKEND_HOST" bundle.bin)" -gt 0 || { echo "FAIL: backend host not embedded"; exit 1; }
          echo "--- version code ---"
          "$BT/aapt2" dump badging "$OUT" | grep -q "versionCode='$ANDROID_VERSION_CODE'" \
            || { echo "FAIL: versionCode is not $ANDROID_VERSION_CODE"; exit 1; }
          echo "versionCode $ANDROID_VERSION_CODE"
          echo "--- checksum ---"
          sha256sum "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.verify.outputs.apk }}
          path: ${{ steps.verify.outputs.apk }}
          retention-days: 14
          if-no-files-found: error

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gstpro-internal.jks"

    outputs:
      apk: ${{ steps.verify.outputs.apk }}

  # Offers the APK to installed apps: they read latest.json from the public
  # android-app release through /api/app/android/latest. Only builds of main
  # are offered. A separate job, so the write token never meets the signing key.
  publish:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APK: ${{ needs.apk.outputs.apk }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.apk.outputs.apk }}
      - name: Publish to the android-app release
        run: |
          set -e
          CODE=$(echo "$APK" | sed -E 's/.*-build([0-9]+)-.*/\1/')
          NAME=$(echo "$APK" | sed -E 's/.*-v([0-9.]+)-build.*/\1/')
          FILE="gstpro-$CODE.apk"
          cp "$APK" "$FILE"
          node -e 'const fs=require("fs"),c=require("crypto"),b=fs.readFileSync(process.argv[1]);fs.writeFileSync("latest.json",JSON.stringify({versionCode:+process.argv[2],versionName:process.argv[3],apkFile:process.argv[1],size:b.length,sha256:c.createHash("sha256").update(b).digest("hex"),mandatory:false,publishedAt:new Date().toISOString()},null,2))' "$FILE" "$CODE" "$NAME"
          cat latest.json
          gh release view android-app -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create android-app -R "$GITHUB_REPOSITORY" --target main --prerelease \
            --title "Android app (latest)" --notes "Published by CI. Installed Billing Pilot apps update themselves from here."
          # The APK first, so latest.json never names a file that is not there yet.
          gh release upload android-app "$FILE" -R "$GITHUB_REPOSITORY" --clobber
          gh release upload android-app latest.json -R "$GITHUB_REPOSITORY" --clobber
          for old in $(gh release view android-app -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E '^gstpro-[0-9]+\.apk$' | grep -vx "$FILE"); do
            gh release delete-asset android-app "$old" -R "$GITHUB_REPOSITORY" -y
          done
