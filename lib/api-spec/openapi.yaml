  /reports/purchases:
    get:
      operationId: getPurchasesReport
      tags: [reports]
      summary: Purchases report
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
        - name: toDate
          in: query
          schema:
            type: string
      responses:
        "200":
