kind = "web"
previewPath = "/"
title = "GST Billing & Inventory Platform"
version = "1.0.0"
id = "artifacts/gst-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25512

[services.development]
run = "pnpm --filter @workspace/gst-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gst-platform", "run", "build" ]
publicDir = "artifacts/gst-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25512"
BASE_PATH = "/"
