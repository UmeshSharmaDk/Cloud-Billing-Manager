# Secret scanning configuration.
#
# The scan runs over the full history, which is the right setting: a secret that
# was ever committed is compromised whether or not the current tree still shows
# it. The consequence is that findings which are already known and already being
# dealt with would fail every build forever, and a check that always fails stops
# being read — which is worse than not running it.
#
# So the allowlist below names exactly the values that were already published in
# this repository's history, and nothing else. A new secret of any shape still
# fails the build. Every entry here is a rotation the operator owes, tracked in
# SECURITY-REVIEW.md under "Operator actions that code cannot perform" — not a
# finding that has been dismissed.

[extend]
useDefault = true

[allowlist]
description = """
Known, already-published values from this repository's history. Each must be
treated as compromised and rotated; baselining them here keeps the scan useful
for detecting *new* leaks, it does not make these safe.
"""

regexes = [
  # F-01 — the JWT signing secret committed as a literal fallback in
  # routes/auth.ts. Removed in the fix; the server now refuses to boot without
  # SESSION_SECRET. Anyone with the repository can mint valid tokens for any
  # deployment still running the old value, so rotating it is urgent.
  '''gst-platform-secret-2024''',

  # F-02 — the demo administrator credentials printed on the public login page,
  # and the single global salt they were hashed with. Removed from the UI; the
  # accounts themselves still need new passwords.
  '''Admin@123''',
  '''admin@gstplatform\.in''',
  '''gst_salt_v1''',
]
